<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1221">
  <title>手のひらARフォトスポット | HAND AR v1.1</title>
  <style>
    :root { color-scheme: dark; --ink:#f6f9ff; --soft:#c4d2e6; --cyan:#79e6ff; --gold:#ffe3aa; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b1221; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); }
    button, input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    #stage { position:fixed; inset:0; overflow:hidden; background:radial-gradient(ellipse at 50% 42%, #23364b 0%, #0b1221 72%); }
    #camera { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
    #camera.mirror { transform:scaleX(-1); }
    #three { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    #three canvas { width:100%; height:100%; display:block; }
    #flash { position:absolute; inset:0; background:white; opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:6; }
    #flash.on { opacity:.8; transition:none; }
    .photo-frame { position:absolute; inset:16px; border:1.5px solid rgba(255,255,255,.68); border-radius:22px; box-shadow:0 0 0 1px rgba(30,60,90,.1); pointer-events:none; z-index:2; }
    .photo-frame::before, .photo-frame::after { content:""; position:absolute; width:32px; height:32px; border-color:var(--cyan); border-style:solid; }
    .photo-frame::before { top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius:22px 0 0 0; }
    .photo-frame::after { right:-2px; bottom:-2px; border-width:0 3px 3px 0; border-radius:0 0 22px 0; }
    .top { position:absolute; z-index:5; top:calc(env(safe-area-inset-top, 0px) + 36px); left:30px; right:30px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:none; }
    .branding { font-weight:900; font-size:clamp(13px,3.8vw,20px); letter-spacing:.15em; line-height:1.1; text-shadow:0 2px 12px #07101f; }
    .branding small { display:block; font-size:10px; letter-spacing:.19em; margin-top:7px; color:var(--gold); }
    #status { max-width:55%; padding:9px 12px; font-size:12px; font-weight:650; line-height:1.5; color:#fff; text-align:right; background:rgba(3,16,31,.68); border:1px solid rgba(255,255,255,.17); border-radius:14px; backdrop-filter:blur(10px); }
    #status.good { border-color:rgba(121,230,255,.7); color:#c6f5ff; }
    #controls { position:absolute; z-index:5; bottom:calc(env(safe-area-inset-bottom, 0px) + 32px); left:30px; right:30px; display:none; flex-direction:column; align-items:center; gap:13px; }
    .scale-control { display:flex; align-items:center; gap:12px; width:min(100%,430px); border-radius:14px; padding:11px 15px; background:rgba(6,21,39,.72); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.18); font-size:12px; font-weight:700; }
    .scale-control label { white-space:nowrap; color:var(--soft); }
    .scale-control input { width:100%; accent-color:var(--cyan); }
    #rotate { flex:0 0 36px; width:36px; height:34px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff; border-radius:10px; font-size:21px; line-height:1; }
    .controls-row { display:flex; width:min(100%,430px); gap:12px; justify-content:center; align-items:stretch; }
    .pill { border:none; border-radius:22px; background:rgba(8,28,49,.78); color:white; font-weight:750; padding:16px 17px; border:1px solid rgba(255,255,255,.3); line-height:1.2; backdrop-filter:blur(14px); }
    .pill.primary { flex:1; background:linear-gradient(135deg, #8deafa, #c8f6fe); color:#082638; border:0; box-shadow:0 8px 28px rgba(40,196,243,.28); font-size:16px; }
    .pill:disabled { opacity:.45; cursor:not-allowed; }
    #guide { position:absolute; z-index:3; top:45%; left:50%; transform:translate(-50%,-50%); border:1px solid rgba(255,255,255,.25); border-radius:18px; padding:14px 20px; text-align:center; background:rgba(5,20,35,.5); backdrop-filter:blur(8px); pointer-events:none; transition:opacity .2s; width:max-content; max-width:85%; }
    #guide.hidden { opacity:0; }
    #guide .hand { font-size:42px; display:block; margin-bottom:5px; }
    #guide span { font-size:13px; font-weight:750; }
    #welcome { position:absolute; z-index:8; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:34px; text-align:center; background:linear-gradient(145deg,rgba(9,23,38,.95),rgba(11,18,33,.99)); }
    #welcome .symbol { font-size:74px; filter:drop-shadow(0 9px 22px rgba(65,210,250,.3)); }
    #welcome h1 { font-size:clamp(28px,8vw,42px); letter-spacing:.08em; margin:10px 0 12px; line-height:1.25; }
    #welcome p { color:var(--soft); line-height:1.8; max-width:380px; font-size:14px; margin:0 0 26px; }
    #start { display:block; width:min(100%,320px); border:0; padding:18px 24px; border-radius:18px; background:var(--cyan); color:#062336; font-size:17px; font-weight:850; }
    #start:disabled { opacity:.6; }
    #notice { font-size:11px; color:#a8bbcf; margin-top:14px; line-height:1.6; }
    #error { display:none; max-width:350px; margin:17px 0 0; text-align:left; font-size:13px; line-height:1.7; color:#ffe4cf; white-space:pre-line; background:#512b2a; padding:12px 14px; border-radius:12px; }
    #preview { display:none; position:fixed; inset:0; background:rgba(4,12,25,.98); z-index:20; padding:calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px); flex-direction:column; align-items:center; justify-content:center; gap:14px; }
    #preview h2 { font-size:18px; margin:0; }
    #photo { max-width:100%; max-height:min(70vh,720px); object-fit:contain; background:#102034; border:1px solid rgba(255,255,255,.2); border-radius:10px; }
    .preview-buttons { display:flex; width:min(100%,420px); gap:10px; }
    .preview-buttons button, .preview-buttons a { flex:1; text-align:center; padding:13px 10px; border-radius:13px; text-decoration:none; font-size:14px; font-weight:780; }
    #save { background:var(--cyan); color:#0a2333; }
    #share { display:none; background:var(--gold); color:#302008; border:0; }
    #back { color:white; background:#2c3b4f; border:0; }
    .hint { font-size:11px; color:#c2cfdf; text-align:center; line-height:1.6; max-width:370px; }
    @media (max-height:650px) { .top { top:calc(env(safe-area-inset-top, 0px) + 26px); } #controls { bottom:calc(env(safe-area-inset-bottom, 0px) + 22px); gap:8px; } .pill { padding:13px 14px; } #guide { top:40%; } }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }}
  </script>
</head>
<body>
  <main id="stage">
    <video id="camera" autoplay muted playsinline aria-label="カメラ映像"></video>
    <div id="three" aria-hidden="true"></div>
    <div class="photo-frame" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>

    <header class="top">
      <div class="branding">HAND AR<small>PHOTO SPOT</small></div>
      <div id="status" role="status" aria-live="polite">カメラを準備しています</div>
    </header>
    <div id="guide"><span class="hand">✋</span><span>手のひらをカメラに向けてください</span></div>

    <div id="controls">
      <div class="scale-control">
        <label for="scale">キャラクターの大きさ</label>
        <input id="scale" type="range" min="0.55" max="1.9" step="0.05" value="1" aria-label="キャラクターの大きさ">
        <button id="rotate" type="button" title="キャラクターの向きを45度回転" aria-label="キャラクターの向きを45度回転">↻</button>
      </div>
      <div class="controls-row">
        <button id="switch" class="pill" type="button">↺ カメラ切替</button>
        <button id="capture" class="pill primary" type="button" disabled>📷 撮影する</button>
      </div>
    </div>

    <section id="welcome" aria-label="開始画面">
      <div class="symbol">✋✨</div>
      <h1>手のひらに<br>橋田選手が登場！</h1>
      <p>カメラで手のひらを映すと、3Dキャラクターが手の動きに合わせて現れます。写真も撮れます。</p>
      <button id="start" type="button">カメラを起動する</button>
      <div id="notice">修正版 v1.1｜HTTPSのページでご利用ください。<br>カメラ映像は端末内で処理し、サーバーには保存しません。</div>
      <div id="error" role="alert"></div>
    </section>
  </main>

  <section id="preview" aria-label="撮影写真の確認">
    <h2>撮影できました！</h2>
    <img id="photo" alt="撮影したAR写真">
    <div class="preview-buttons">
      <a id="save" download="hand-ar-photo.png">写真を保存</a>
      <button id="share" type="button">共有・保存</button>
      <button id="back" type="button">戻る</button>
    </div>
    <div class="hint">iPhoneで写真アプリへ保存する場合は「共有・保存」から「画像を保存」を選ぶか、表示された画像を長押ししてください。</div>
  </section>

  <script type="module">
    // 読み込み失敗を画面に出せるよう、各ライブラリは起動時に動的に読み込む。
    // 0.10.22 は正式リリースがなく、読み込めない可能性があるため、公開済み安定版に固定する。
    let THREE, GLTFLoader, HandLandmarker, FilesetResolver;

    // お使いの3Dモデル。HTMLと同じフォルダに配置してください。
    const MODEL_URL = './hashida.glb';
    const MP_VERSION = '0.10.35';
    const HAND_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

    const $ = (id) => document.getElementById(id);
    const video = $('camera');
    const statusEl = $('status');
    const welcome = $('welcome');
    const startBtn = $('start');
    const errorEl = $('error');
    const guide = $('guide');
    const controls = $('controls');
    const captureBtn = $('capture');
    const switchBtn = $('switch');
    const scaleInput = $('scale');
    const rotateBtn = $('rotate');
    const preview = $('preview');

    let handTracker = null, renderer = null, scene = null, viewCamera = null;
    let mascotRoot = null, modelHeight = 1, cameraStream = null;
    let mode = 'user'; // 最初は内側カメラ。撮影ボタンで切替可能。
    let running = false, lastSeen = 0, lastVideoTime = -1, lastDetect = 0;
    let lastDetected = false, photoURL = null, photoBlob = null;
    let hasSmoothed = false, yawDeg = 0;
    let tracked = {x:0, y:0, size:100, tilt:0};
    let target = {x:0, y:0, size:100, tilt:0};
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    function setStatus(message, good=false) {
      if (statusEl.textContent !== message) statusEl.textContent = message;
      statusEl.classList.toggle('good', good);
    }

    // 読み込みが終わらない場合でも、画面に説明を出して再試行できるようにする。
    function timeout(promise, ms, label) {
      let id;
      const expired = new Promise((_, reject) => {
        id = setTimeout(() => reject(new Error(
          `${label}の読み込みが完了しませんでした。通信状態を確認し、SafariまたはChromeで開き直してください。`
        )), ms);
      });
      return Promise.race([promise, expired]).finally(() => clearTimeout(id));
    }

    async function loadLibraries() {
      setStatus('3D表示ライブラリを読み込み中');
      let packages;
      try {
        packages = await timeout(Promise.all([
          import('three'),
          import('three/addons/loaders/GLTFLoader.js')
        ]), 20000, '3D表示ライブラリ');
      } catch (e) {
        throw new Error('3D表示ライブラリを読み込めませんでした。通信環境やブラウザの制限を確認してください。 (' + (e?.message || e) + ')');
      }
      THREE = packages[0];
      GLTFLoader = packages[1].GLTFLoader;

      setStatus('手の認識ライブラリを読み込み中');
      let mp;
      try {
        mp = await timeout(import(
          `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`
        ), 20000, '手の認識ライブラリ');
      } catch (e) {
        throw new Error('手の認識ライブラリを読み込めませんでした。通信環境やブラウザの制限を確認してください。 (' + (e?.message || e) + ')');
      }
      ({ HandLandmarker, FilesetResolver } = mp);
      if (!HandLandmarker || !FilesetResolver || !GLTFLoader) {
        throw new Error('ARのプログラムを正しく読み込めませんでした。ページを再読み込みしてください。');
      }
    }

    async function openCamera(nextMode) {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('このブラウザではカメラを利用できません。SafariまたはChromeでHTTPSのURLを開いてください。');
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
        video.srcObject = null;
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: nextMode }, width:{ ideal:1280 }, height:{ ideal:720 } }
      });
      cameraStream = stream;
      video.srcObject = stream;
      video.classList.toggle('mirror', nextMode === 'user');
      await timeout(video.play(), 15000, 'カメラ映像');
      mode = nextMode;
      lastVideoTime = -1;
      lastSeen = 0;
      lastDetected = false;
      hasSmoothed = false;
      if (mascotRoot) mascotRoot.visible = false;
      guide.classList.remove('hidden');
    }

    async function prepareHandTracker() {
      const files = await FilesetResolver.forVisionTasks(
        `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`
      );
      const base = { modelAssetPath: HAND_MODEL_URL, delegate:'GPU' };
      const opts = {
        baseOptions: base,
        runningMode:'VIDEO',
        numHands:1,
        minHandDetectionConfidence:0.55,
        minHandPresenceConfidence:0.55,
        minTrackingConfidence:0.5
      };
      try {
        return await timeout(HandLandmarker.createFromOptions(files, opts), 20000, 'GPUでの手の認識準備');
      } catch (gpuError) {
        console.warn('GPU認識を利用できないためCPUで再試行します', gpuError);
        return await timeout(HandLandmarker.createFromOptions(files, {
          ...opts, baseOptions:{ modelAssetPath:HAND_MODEL_URL, delegate:'CPU' }
        }), 25000, 'CPUでの手の認識準備');
      }
    }

    async function prepareThree() {
      const holder = $('three');
      renderer = new THREE.WebGLRenderer({
        alpha:true, antialias:true, preserveDrawingBuffer:true,
        powerPreference:'default'
      });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      holder.appendChild(renderer.domElement);
      scene = new THREE.Scene();
      viewCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 3000);
      viewCamera.position.set(0,0,1000);
      viewCamera.lookAt(0,0,0);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x67748c, 2.1));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.3);
      keyLight.position.set(-1, 2, 3);
      scene.add(keyLight);
      resizeThree();

      const loader = new GLTFLoader();
      let gltf;
      try {
        gltf = await loader.loadAsync(MODEL_URL);
      } catch (e) {
        console.error('GLB読み込みエラー', e);
        throw new Error('mascot.glb を読み込めませんでした。hand-ar.html と mascot.glb を同じフォルダにアップロードしているか確認してください。');
      }

      const bounds = new THREE.Box3().setFromObject(gltf.scene);
      const dim = new THREE.Vector3();
      const center = new THREE.Vector3();
      bounds.getSize(dim);
      bounds.getCenter(center);
      if (!Number.isFinite(dim.y) || dim.y < 0.0001) {
        throw new Error('mascot.glb の高さを取得できませんでした。GLBの形状を確認してください。');
      }
      modelHeight = dim.y;
      // 足元を原点に、横方向の中心を手のひら中央に合わせる。
      gltf.scene.position.set(-center.x, -bounds.min.y, -center.z);
      mascotRoot = new THREE.Group();
      mascotRoot.add(gltf.scene);
      mascotRoot.visible = false;
      scene.add(mascotRoot);

      // 手のひらに接しているように見せる簡易的な影。
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(dim.x * 0.35, 40),
        new THREE.MeshBasicMaterial({color:0x082338, transparent:true, opacity:0.22, depthWrite:false, depthTest:false})
      );
      shadow.scale.set(1, 0.38, 1);
      shadow.position.set(0, 0.02, -dim.z / 2 - 0.1);
      shadow.renderOrder = -1;
      mascotRoot.add(shadow);
    }

    function resizeThree() {
      if (!renderer || !viewCamera) return;
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      viewCamera.left = -w / 2;
      viewCamera.right = w / 2;
      viewCamera.top = h / 2;
      viewCamera.bottom = -h / 2;
      viewCamera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeThree);

    // カメラ映像は object-fit: cover なので、認識点を画面座標へ変換する。
    function screenPoint(p) {
      const w = window.innerWidth, h = window.innerHeight;
      const vw = video.videoWidth, vh = video.videoHeight;
      const ratio = Math.max(w / vw, h / vh);
      const displayedW = vw * ratio, displayedH = vh * ratio;
      const px = p.x * displayedW - (displayedW - w) / 2;
      const py = p.y * displayedH - (displayedH - h) / 2;
      return { x: mode === 'user' ? w - px : px, y:py };
    }

    function updatePalm(landmarks) {
      const wrist = screenPoint(landmarks[0]);
      const index = screenPoint(landmarks[5]);
      const middle = screenPoint(landmarks[9]);
      const ring = screenPoint(landmarks[13]);
      const pinky = screenPoint(landmarks[17]);
      const pts = [wrist,index,middle,ring,pinky];
      const cx = pts.reduce((a,p) => a+p.x, 0) / pts.length;
      const cy = pts.reduce((a,p) => a+p.y, 0) / pts.length;
      const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
      const palmWidth = dist(index,pinky);
      const palmHeight = dist(wrist,middle);
      const palmSize = Math.max(palmWidth, palmHeight*0.9);
      if (!Number.isFinite(palmSize) || palmSize < 23) return false;

      target.x = cx;
      target.y = cy;
      target.size = clamp(palmSize * 1.38 * Number(scaleInput.value), 50, Math.min(window.innerWidth*0.67, 440));
      const tilt = Math.atan2(middle.x-wrist.x, wrist.y-middle.y);
      target.tilt = clamp(tilt, -0.7, 0.7) * 0.45;
      return true;
    }

    function animate(now) {
      if (!running) return;
      requestAnimationFrame(animate);

      if (handTracker && video.readyState >= 2 && video.videoWidth > 0 &&
          video.currentTime !== lastVideoTime && now-lastDetect >= 60) {
        lastDetect = now;
        lastVideoTime = video.currentTime;
        try {
          const result = handTracker.detectForVideo(video, now);
          const found = result.landmarks?.[0];
          if (found && updatePalm(found)) {
            lastSeen = now;
            lastDetected = true;
            setStatus('手を認識しています ✓', true);
            guide.classList.add('hidden');
            captureBtn.disabled = false;
          }
        } catch (e) {
          console.warn('手の認識処理:', e);
        }
      }

      const visible = lastSeen > 0 && now-lastSeen < 450;
      if (mascotRoot) {
        mascotRoot.visible = visible;
        if (visible) {
          if (!hasSmoothed) {
            Object.assign(tracked, target);
            hasSmoothed = true;
          } else {
            const a = 0.26;
            for (const k of ['x','y','size','tilt']) tracked[k] += (target[k] - tracked[k]) * a;
          }
          mascotRoot.position.set(tracked.x-window.innerWidth/2, window.innerHeight/2-tracked.y, 0);
          const s = tracked.size / modelHeight;
          mascotRoot.scale.setScalar(s);
          mascotRoot.rotation.z = tracked.tilt;
          mascotRoot.rotation.y = yawDeg * Math.PI/180 + Math.sin(now/1900) * 0.055;
          // 立体的に見えるように非常に小さな上下運動を加える。
          mascotRoot.position.y += Math.sin(now/420) * 1.2;
        } else {
          hasSmoothed = false;
          if (lastDetected) {
            setStatus('手のひらを広げて映してください');
            guide.classList.remove('hidden');
            captureBtn.disabled = true;
            lastDetected = false;
          }
        }
      }
      if (renderer && scene && viewCamera) renderer.render(scene, viewCamera);
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = '準備しています…';
      errorEl.style.display = 'none';
      try {
        setStatus('カメラを起動しています');
        await timeout(openCamera(mode), 20000, 'カメラ');
        await loadLibraries();
        setStatus('手の認識モデルと3Dキャラクターを読み込み中');
        const [tracker] = await Promise.all([
          timeout(prepareHandTracker(), 55000, '手の認識モデル'),
          timeout(prepareThree(), 30000, '3Dキャラクター')
        ]);
        handTracker = tracker;
        welcome.style.display = 'none';
        controls.style.display = 'flex';
        running = true;
        setStatus('手のひらをカメラに向けてください');
        requestAnimationFrame(animate);
      } catch (e) {
        console.error(e);
        setStatus('起動できませんでした');
        errorEl.textContent = e?.name === 'NotAllowedError'
          ? 'カメラの使用が拒否されました。ブラウザのアドレス欄付近からカメラの許可を変更し、もう一度試してください。'
          : e?.name === 'NotFoundError'
            ? 'カメラが見つかりません。カメラがある端末で開き直してください。'
            : (e?.message || '起動に失敗しました。');
        errorEl.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = 'もう一度試す';
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
        video.srcObject = null;
      }
    });

    rotateBtn.addEventListener('click', () => {
      yawDeg = (yawDeg + 45) % 360;
    });

    switchBtn.addEventListener('click', async () => {
      if (!running) return;
      switchBtn.disabled = true;
      setStatus('カメラを切り替えています');
      const oldMode = mode;
      try {
        await openCamera(mode === 'user' ? 'environment' : 'user');
        setStatus('手のひらをカメラに向けてください');
        captureBtn.disabled = true;
      } catch(e) {
        console.warn('カメラ切替エラー', e);
        try { await openCamera(oldMode); } catch(_) {}
        setStatus('カメラを切り替えられませんでした');
      } finally {
        switchBtn.disabled = false;
      }
    });

    function drawPhotoFrame(ctx,w,h) {
      ctx.save();
      const inset = Math.max(16, w * 0.04);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(2,w/320);
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(inset, inset, w-2*inset, h-2*inset, 20);
      } else {
        ctx.rect(inset, inset, w-2*inset, h-2*inset);
      }
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,.85)';
      ctx.shadowBlur = 9;
      ctx.font = `800 ${Math.max(17,w*0.042)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('HAND AR PHOTO SPOT', w/2, inset+34);
      ctx.restore();
    }

    captureBtn.addEventListener('click', () => {
      if (!running || !video.videoWidth || !mascotRoot?.visible) return;
      const W = window.innerWidth, H = window.innerHeight;
      const factor = Math.min(window.devicePixelRatio||1, 2);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(W * factor);
      canvas.height = Math.round(H * factor);
      const ctx = canvas.getContext('2d');
      ctx.scale(factor,factor);

      // 撮影画像とライブ映像のトリミング・鏡像を一致させる。
      const ratio = Math.max(W/video.videoWidth, H/video.videoHeight);
      const sw = W/ratio, sh = H/ratio;
      const sx = (video.videoWidth-sw)/2, sy = (video.videoHeight-sh)/2;
      ctx.save();
      if (mode === 'user') {ctx.translate(W,0);ctx.scale(-1,1);}
      ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);
      ctx.restore();
      renderer.render(scene,viewCamera);
      ctx.drawImage(renderer.domElement,0,0,W,H);
      drawPhotoFrame(ctx,W,H);
      $('flash').classList.add('on');
      requestAnimationFrame(() => $('flash').classList.remove('on'));
      canvas.toBlob((blob) => {
        if (!blob) {setStatus('写真の生成に失敗しました');return;}
        if (photoURL) URL.revokeObjectURL(photoURL);
        photoBlob = blob;
        photoURL = URL.createObjectURL(blob);
        $('photo').src = photoURL;
        $('save').href = photoURL;
        $('share').style.display = (navigator.canShare && navigator.canShare({files:[new File([blob],'hand-ar-photo.png',{type:'image/png'})]})) ? 'block' : 'none';
        preview.style.display = 'flex';
      },'image/png');
    });

    $('share').addEventListener('click', async () => {
      if (!photoBlob || !navigator.share) return;
      try {
        const file = new File([photoBlob],'hand-ar-photo.png',{type:'image/png'});
        await navigator.share({files:[file],title:'HAND AR PHOTO SPOT'});
      } catch(e) {
        if (e?.name !== 'AbortError') console.warn('共有できませんでした',e);
      }
    });
    $('back').addEventListener('click', () => {preview.style.display='none';});
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // ブラウザが背面に回ったとき、推論ループによる負荷を抑える。
        lastSeen = 0;
      }
    });
  </script>
</body>
</html>
